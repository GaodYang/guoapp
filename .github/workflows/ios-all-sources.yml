name: Build iOS all sources

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-all-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Check Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          pod --version
          flutter --version
      - name: Build all sources unsigned IPA
        run: python3 scripts/build_ios.py --all-sources
      - name: Upload iOS installation package
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-ios-all-sources
          path: |
            dist/ios/zhenguojian-*-ios-unsigned.ipa
            dist/ios/zhenguojian-*-ios-unsigned-app.zip
            dist/ios/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
